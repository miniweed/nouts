name: Release

# Al empujar un tag vX.Y.Z se construye y publica la imagen multi-arquitectura
# en GHCR. El digest del manifest-list queda en el resumen del job para pinearlo
# en umbrel/miniweed-nouts/docker-compose.yml (el PR al store sigue siendo
# manual, como hasta ahora).
on:
  push:
    tags:
      - "v*"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versión desde el tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miniweed/nouts:${{ steps.meta.outputs.version }}
            ghcr.io/miniweed/nouts:latest
      - name: Digest del manifest-list
        run: |
          echo "Imagen: ghcr.io/miniweed/nouts:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
